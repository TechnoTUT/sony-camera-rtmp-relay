name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: technotut/sonycam-nginx

jobs:
  validate:
    name: Validate Configuration & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: |
          cp .env.example .env
          docker compose config

      - name: Validate CoreDNS configuration
        run: |
          docker run --rm -v "$(pwd)/dns/Corefile:/etc/coredns/Corefile:ro" \
            -e RELAY_IP=127.0.0.1 -e UPSTREAM_DNS=1.1.1.1 \
            coredns/coredns:latest -conf /etc/coredns/Corefile &
          PID=$!
          sleep 2
          if ! kill -0 $PID 2>/dev/null; then
            echo "Error: CoreDNS failed to start with the provided Corefile"
            exit 1
          fi
          kill $PID 2>/dev/null || true

      - name: Test build Nginx container image
        run: |
          docker build -t test-nginx -f ./nginx/Dockerfile .

  publish-nginx-image:
    name: Build & Publish Nginx Image
    needs: validate
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
